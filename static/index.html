<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每天开口</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <h1>每天开口</h1>
      <p id="subline">加载中…</p>
    </div>
    <div class="streak" aria-label="连续练习">
      <div class="num"><b id="streakNum">0</b><span>天连续</span></div>
      <div class="week" id="weekDots" aria-label="最近 7 天"></div>
    </div>
    <nav class="nav" role="tablist">
      <a href="#today" data-tab="today">今天</a>
      <a href="#chunks" data-tab="chunks">语块本<span class="badge" id="dueBadge" hidden></span></a>
      <a href="#chat" data-tab="chat">AI 对话</a>
      <a href="#log" data-tab="log">记录</a>
      <a href="#settings" data-tab="settings">设置</a>
    </nav>
    <p class="foot" id="railFoot"></p>
  </aside>
  <div class="main">
    <main data-view="today" id="view-today"></main>
    <main data-view="chunks" id="view-chunks" hidden></main>
    <main data-view="chat" id="view-chat" hidden></main>
    <main data-view="log" id="view-log" hidden></main>
    <main data-view="settings" id="view-settings" hidden></main>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
